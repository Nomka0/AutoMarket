<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>{{.Title}} - AutoMarket</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <div class="nav-container">
      <a href="/catalog" class="logo">Auto<span>Market</span></a>
      <nav>
        <a href="/catalog">Catálogo</a>
        <span class="nav-divider"></span>
        <span class="nav-badge nav-badge-visitor"><span class="badge-dot"></span>Visitante (Público)</span>
        <span class="nav-divider"></span>
        <a href="/login">Ingresar</a>
        <a href="/register" class="nav-cta">Registrarse</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="form-card">
      <h2>Registro de Vendedor</h2>
      <p style="color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 1.25rem;">Regístrate de forma autónoma para publicar tus vehículos y gestionar tus ventas.</p>

      {{if .Error}}<div class="alert alert-error">{{.Error}}</div>{{end}}

      <form action="/register" method="POST">
        <div class="form-group">
          <label for="username">Nombre de Usuario</label>
          <input type="text" id="username" name="username" required autocomplete="username" autofocus>
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" required autocomplete="new-password">
        </div>
        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input type="email" id="email" name="email" placeholder="ej. juan@gmail.com" required>
        </div>
        <div class="form-group">
          <label for="phone">Número de Teléfono / Móvil</label>
          <input type="tel" id="phone" name="phone" placeholder="ej. 3001234567" required>
        </div>
        <button type="submit" class="btn btn-primary" style="margin-top: 0.5rem;">Completar Registro</button>
      </form>

      <div style="margin-top: 1.5rem; text-align: center; font-size: 0.85rem; color: var(--text-secondary);">
        ¿Ya tienes cuenta? <a href="/login" style="color: var(--accent-primary);">Inicia Sesión</a>
      </div>
    </div>
  </main>

  <footer>
    AutoMarket &bull; Sistema Seguro de Venta de Vehículos &bull; Gin Framework
  </footer>
</body>
</html>
